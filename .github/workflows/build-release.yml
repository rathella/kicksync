name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install -D electron electron-builder

      - name: Create Electron Main File
        run: |
          New-Item -ItemType Directory -Force -Path electron
          @'
          const { app, BrowserWindow, shell, ipcMain } = require('electron');
          const path = require('path');
          const net = require('net');
          const fs = require('fs');

          let mainWindow = null;
          let ipcSocket = null;
          let isConnected = false;

          function connectDiscord(clientId) {
            if (isConnected && ipcSocket) return;
            for (let i = 0; i < 10; i++) {
              const pipePath = `\\\\.\\pipe\\discord-ipc-${i}`;
              try {
                const socket = net.createConnection(pipePath, () => {
                  ipcSocket = socket;
                  isConnected = true;
                  const payload = JSON.stringify({ v: 1, client_id: clientId });
                  const len = Buffer.byteLength(payload);
                  const header = Buffer.alloc(8);
                  header.writeUInt32LE(0, 0);
                  header.writeUInt32LE(len, 4);
                  socket.write(Buffer.concat([header, Buffer.from(payload)]));
                });
                socket.on('error', () => {});
                socket.on('close', () => { isConnected = false; ipcSocket = null; });
                if (isConnected) break;
              } catch (err) {}
            }
          }

          function sendActivity(activity) {
            if (!ipcSocket || !isConnected) return;
            const payload = JSON.stringify({
              cmd: "SET_ACTIVITY",
              args: { pid: process.pid, activity },
              nonce: Math.random().toString(36).substring(2)
            });
            const len = Buffer.byteLength(payload);
            const header = Buffer.alloc(8);
            header.writeUInt32LE(1, 0);
            header.writeUInt32LE(len, 4);
            try { ipcSocket.write(Buffer.concat([header, Buffer.from(payload)])); } catch (e) {}
          }

          function createWindow() {
            mainWindow = new BrowserWindow({
              width: 500,
              height: 720,
              resizable: false,
              title: "KickSync",
              backgroundColor: "#18181B",
              webPreferences: { nodeIntegration: true, contextIsolation: false }
            });
            mainWindow.setMenuBarVisibility(false);
            mainWindow.webContents.setWindowOpenHandler(({ url }) => {
              shell.openExternal(url);
              return { action: 'deny' };
            });
            const indexPath = path.join(__dirname, '../dist-ui/index.html');
            mainWindow.loadFile(indexPath);
          }

          app.whenReady().then(() => {
            createWindow();
            connectDiscord("1547766245993226380");
          });

          app.on('window-all-closed', () => {
            if (ipcSocket) { try { ipcSocket.end(); } catch (e) {} }
            if (process.platform !== 'darwin') app.quit();
          });

          ipcMain.handle('update-discord-activity', (e, act) => {
            sendActivity(act);
            return true;
          });
          '@ | Set-Content -Path electron/main.cjs -Encoding UTF8

      - name: Configure package.json for Electron
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.main = 'electron/main.cjs'; pkg.build = { appId: 'com.kicksync.app', productName: 'KickSync', directories: { output: 'dist-electron' }, files: ['electron/**/*', 'dist-ui/**/*'], win: { target: [{ target: 'portable', arch: ['x64'] }] } }; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Build React UI
        run: npx vite build --outDir dist-ui

      - name: Package Portable Windows EXE
        run: npx electron-builder --win portable --x64 --publish never

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "KickSync v1.1.0 - Modern UI Windows Release"
          body: |
            ## 🎮 KickSync v1.1.0 (Modern React UI Windows Portable)
            
            OBS üzerinden Kick'te canlı yayına geçtiğinizde Discord profilinizi otomatik olarak **"Yayında (Streaming Now)"** durumuna getiren bağımsız modern Windows masaüstü uygulaması.
            
            ### 📥 İndirme ve Kullanım:
            Aşağıdaki **Assets** bölümünden `KickSync 1.0.0.exe` dosyasını indirip çift tıklayarak doğrudan çalıştırabilirsiniz!
          files: dist-electron/KickSync*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
