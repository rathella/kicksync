name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow requests

      - name: Build KickSync.exe
        run: |
          pyinstaller --noconsole --onefile --name "KickSync" app/main.py

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KickSync v1.0.0 - Windows Release"
          body: |
            ## 🎮 KickSync v1.0.0 (Windows Portable)
            
            OBS üzerinden Kick'te canlı yayına geçtiğinizde Discord profilinizi otomatik olarak **"Yayında (Streaming Now)"** durumuna getiren bağımsız Windows masaüstü uygulaması.
            
            ### 📥 İndirme ve Kullanım:
            Aşağıdaki **Assets** bölümünden `KickSync.exe` dosyasını indirip çift tıklayarak doğrudan çalıştırabilirsiniz!
          files: dist/KickSync.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
