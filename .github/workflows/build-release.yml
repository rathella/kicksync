name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Portable Windows EXE
        run: npm run build:exe

      - name: Rename executable
        run: |
          if (Test-Path "dist-electron/KickSync 1.0.0.exe") {
            Move-Item "dist-electron/KickSync 1.0.0.exe" "dist-electron/KickSync.exe" -Force
          }

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KickSync v1.0.0 - Windows Release"
          body: |
            ## 🎮 KickSync v1.0.0 (Windows Portable)
            
            OBS üzerinden Kick'te canlı yayına geçtiğinizde Discord profilinizi otomatik olarak **"Yayında (Streaming Now)"** durumuna getiren bağımsız Windows masaüstü uygulaması.
            
            ### 📥 İndirme:
            Aşağıdaki **Assets** bölümünden `KickSync.exe` dosyasını indirip çift tıklayarak doğrudan çalıştırabilirsiniz!
          files: dist-electron/KickSync.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
