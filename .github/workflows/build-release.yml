name: Build and Release Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Modern KickSync.exe (React + Electron)
        run: npm run build:exe

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "KickSync v1.1.0 - Modern UI Windows Release"
          body: |
            ## 🎮 KickSync v1.1.0 (Modern UI Windows Portable)
            
            OBS üzerinden Kick'te canlı yayına geçtiğinizde Discord profilinizi otomatik olarak **"Yayında (Streaming Now)"** durumuna getiren bağımsız modern Windows masaüstü uygulaması.
            
            ### 📥 İndirme ve Kullanım:
            Aşağıdaki **Assets** bölümünden `KickSync 1.0.0.exe` (veya `KickSync.exe`) dosyasını indirip çift tıklayarak doğrudan çalıştırabilirsiniz!
          files: dist-electron/KickSync*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
